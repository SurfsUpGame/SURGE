name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_SERIES: "5.2"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libxkbcommon0
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          file=$(curl -sSf "$base/" \
            | grep -o "blender-${BLENDER_SERIES}\.[0-9]\+-linux-x64\.tar\.xz" \
            | sort -V | tail -1)
          test -n "$file"
          curl -sSfL "$base/$file" -o blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Report the Blender version
        run: blender --version

      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' blender_manifest.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Run the tests
        run: blender -b --factory-startup --python tests/run_tests.py

      - name: Build the extension
        run: |
          mkdir -p dist
          blender --command extension build --source-dir . --output-dir dist

      - name: Validate the extension
        run: blender --command extension validate dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: surge-extension
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "SURGE $GITHUB_REF_NAME" \
            --generate-notes
